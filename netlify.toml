# Netlify configuration for Expo Web (React Native Web)
[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: Redirect all routes to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
